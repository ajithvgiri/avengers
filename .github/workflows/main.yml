# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ develop ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Install all react packages
      - name: Install React Packages
        run: npm install

      # Build react project using npm
      #Builds the app for production to the `build` folder.cIt correctly bundles React in production mode and optimizes the build for the best performance.
      - name: Build React Project
        run: npm run build
        
      - name: Deploy Firebase Site
      # You may pin to the exact commit or the version.
      # uses: danielmillan/pipelines-firebase-hosting@8a7c15d150288fde37efe3edb186e5bb5931c3de
      uses: danielmillan/pipelines-firebase-hosting@1.0.8
      with:
      # Token generated to authenticate in firebase
      firebase-token: AAAAZ_oX1Dc:APA91bEN1XyDfo6rz7XKnXT4aNXQY77ntuVsxA6RBvUaDuOYVoeqrKiItvyN0weNxstovUEjWgLONZhk_slPEQL2WrEiL3xBX2pBCRT5LSWgWKrtC4-yVAkdHKp9yu6Il18UaCvxrdZp
      # Name of the folder containing the resources to be deployed
      resources-name: build
      # Firebase project name
      project-name: Fort Pedallers Palakkad
      # Target name if you need to deploy to a specific instance
      target-name: fortpedallerspalakkad
