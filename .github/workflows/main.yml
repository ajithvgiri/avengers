# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ develop ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Install all react packages
      - name: Install React Packages
        run: npm install

      # Build react project using npm
      #Builds the app for production to the `build` folder.cIt correctly bundles React in production mode and optimizes the build for the best performance.
      - name: Build React Project
        run: npm run build
        
      - name: Deploy Firebase Site
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "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"
          firebaseServiceAccount: "firebase-adminsdk-mbw55@fort-pedallers-palakkad.iam.gserviceaccount.com"
          projectId: fort-pedallers-palakkad
          channelId: live
          
