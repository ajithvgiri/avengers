# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ develop ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x]

    steps:
     name: Checkout repository
      uses: actions/checkout@v2

     name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

     name: Install dependencies
      run: npm install

     name: Run the tests and generate coverage report
      run: npm test -- --coverage
        name: Generate build
        run: npm run build
      # Share artifact inside workflow
        name: Share artifact inside workflow
        uses: actions/upload-artifact@v1
        with:
          name: react-github-actions-build
          path: build
  deploy:
    runs-on: ubuntu-latest
    # When application is successfully tested and build has been generated
    # Then we can start with deployment
    needs: build
    steps:
      # Download previously shared build
        name: Get artifact
        uses: actions/download-artifact@v1
        with:
          name: react-github-actions-build
        
        name: Deploy Firebase Site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "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"
          firebaseServiceAccount: "firebase-adminsdk-mbw55@fort-pedallers-palakkad.iam.gserviceaccount.com"
          projectId: fort-pedallers-palakkad
          channelId: live
          
